<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2346c8" />
    <meta name="description" content="MyUMN — jadwal, rencana studi, hasil akademik, dan kegiatan mahasiswa dalam satu portal." />
    <link rel="icon" type="image/png" href="/myumn-mark.png" />
    <title>MyUMN · Student Portal</title>
    <script>
      // Apply saved theme and language before the first paint to avoid a flash.
      try {
        var t = localStorage.getItem('myumn_theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('myumn_lang');
        if (l === 'en' || l === 'id') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
